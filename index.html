<style id="css">
:root{
  --ground:#F2F2F1; --surface:#FFFFFF; --ink:#191A1B; --muted:#6E7176;
  --line:#DEDFE0; --soft:#ECEDED; --accent:#6E6E6E; --accent-on:#FFFFFF;

  --danger:#9E3B2F; --shadow:0 1px 3px rgba(20,22,23,.07),0 8px 24px rgba(20,22,23,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131415; --surface:#1C1E20; --ink:#EBECEC; --muted:#979A9F;
    --line:#2D3033; --soft:#24272A; --accent:#A8A8A8; --accent-on:#1A1A1A;
    --ok:#62BD93; --ok-soft:#1E2E27; --warn-bg:#312D1D; --warn-ink:#D8C070;
    --danger:#D4796C; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#131415; --surface:#1C1E20; --ink:#EBECEC; --muted:#979A9F;
  --line:#2D3033; --soft:#24272A; --accent:#A8A8A8; --accent-on:#1A1A1A;
  --ok:#62BD93; --ok-soft:#1E2E27; --warn-bg:#312D1D; --warn-ink:#D8C070;
  --danger:#D4796C; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px; line-height:1.55; min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:660px;margin:0 auto;padding:24px 18px 64px}
.wrap.wide{max-width:960px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin-top:6px}
.sub{color:var(--muted);margin-top:8px;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.banner{border-radius:10px;padding:10px 14px;font-size:13.5px;background:var(--warn-bg);color:var(--warn-ink);margin-bottom:16px}
.banner.okb{background:var(--ok-soft);color:var(--ok)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 10px;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.pbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;text-align:center;transition:border-color .12s}
.pbtn:hover{border-color:var(--accent)}
.pbtn .pid{font-weight:600;font-size:15px}
.pbtn .st{display:block;font-size:11.5px;margin-top:3px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbtn.part .st{color:var(--accent);font-weight:500}
.pbtn.done{background:var(--ok-soft);border-color:transparent}
.pbtn.done .st{color:var(--ok);font-weight:500}
.foot{margin-top:26px;display:flex;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:13px 22px;font-size:15.5px;font-weight:500;background:var(--accent);color:var(--accent-on);min-height:48px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.center{text-align:center}
.trialnum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.codechip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px;letter-spacing:.02em;background:var(--soft);border-radius:14px;padding:14px 30px;margin:14px 0 6px}
.codesub{color:var(--muted);font-size:14.5px}
button.codechip{cursor:pointer}
.codechip.masked{font-size:17px;font-weight:500;font-family:inherit;color:var(--muted);background:none;border:1.5px dashed var(--line);padding:22px 34px}
.guide{list-style:none;margin-top:12px;display:grid;gap:10px}
.guide li{padding-left:20px;position:relative;font-size:14.5px}
.guide li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.topbar{position:sticky;top:0;z-index:5;background:var(--ground);padding:12px 0 10px;margin-bottom:6px}
.topline{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted)}
.topline b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .2s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.btn:active{transform:none}}
.hint{font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.sect{margin-top:20px}
.sectlab{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.items{margin-top:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px 16px;margin-bottom:10px}
.item.miss{border-color:var(--danger)}
.poles{display:flex;justify-content:space-between;gap:12px;font-size:18px;font-weight:500}
.poles .r{text-align:right}
.q{font-size:18px;font-weight:500;line-height:1.5}
.anchors{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:12px;padding:0 4px}
.dots7 .dot{width:40px;height:40px;font-size:13px}
.anchors.a7{display:flex;justify-content:space-between;max-width:440px;margin:8px auto 0;padding:0 20px;line-height:1.35}
.anchors.a7 span{width:0;display:flex;justify-content:center}
.anchors.a7 i{flex:none;font-style:normal;text-align:center;white-space:nowrap}
body.big-dots .anchors.a7{max-width:460px;padding:0 24px}
.dots7 .dotrow{max-width:440px}
.dots7 .dotrow::before{left:20px;right:20px}
body.big-dots .dots7 .dot{width:48px;height:48px;font-size:14px}
.choicerow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.choice{flex:1;min-width:88px;border:1.5px solid var(--line);border-radius:10px;padding:13px 10px;font-size:15.5px;color:var(--muted);text-align:center}
.choice[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600}
.etcin{width:100%;margin-top:12px;font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.etcin::placeholder{color:var(--muted);opacity:.7}
.breaktime{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:22px}
.dots{display:flex;justify-content:center;margin-top:14px}
.dotrow{position:relative;display:flex;flex:1 1 auto;max-width:400px;justify-content:space-between}
.dotrow::before{content:"";position:absolute;top:50%;left:23px;right:23px;height:1.5px;background:var(--line);transform:translateY(-50%)}
.dot{position:relative;background:var(--surface);width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:background .1s,border-color .1s}
.dot:hover{border-color:var(--accent)}
.dot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600}
.missnote{color:var(--danger);font-size:13.5px;margin:4px 0 10px;display:none}
.missnote.show{display:block}
.donemark{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.eyeicon{display:flex;justify-content:center;color:var(--muted)}
.vwrap{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:24px;padding-bottom:32px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.part{background:var(--soft);color:var(--accent);font-weight:500}
.del{color:var(--danger);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.del.arm{background:var(--danger);border-color:var(--danger);color:#fff}
.admhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.note b{color:var(--ink)}
.backlink{font-size:14px;color:var(--muted);display:inline-block;margin-bottom:12px}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:640px;width:100%;box-shadow:var(--shadow)}
.modal textarea{width:100%;height:240px;margin:12px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
body.big-text{font-size:17.5px}
body.big-dots .dot{width:58px;height:58px;font-size:16px}
body.big-dots .dotrow{max-width:460px}
body.big-dots .dotrow::before{left:29px;right:29px}
@media (max-width:420px){body.big-dots .dot{width:50px;height:50px}}
.btn.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
select.psel{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.frm .full{grid-column:1/-1}
.frm label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.frm input,.frm select{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.ordergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
.ocell{border:1px solid var(--line);border-radius:8px;padding:17px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface);width:100%;position:relative}
.ocell.odone{opacity:.4}
.ocell.ochk{border-color:var(--accent)}
.ocell.onext{border:2px solid var(--accent)}
.ocell.odelarm{opacity:1;border:2px solid var(--danger)}
.omark{position:absolute;top:3px;right:6px;color:var(--accent);font-weight:600;font-size:12px}
.onum{position:absolute;top:3px;left:6px;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.ocat{font-size:11px;color:var(--muted)}
.ocode{font-size:13.5px;font-weight:600}
</style>
</head>

(function(){

// ────────────────────────────────────────────────────────

var COND_LABEL={V:'시각',T:'시각+촉각'};
var COND_KEY={V:'visual',T:'visual+touch'};

// 18문항 (ITEMS[i].rev = 역문항: 분석 시 8-점 역채점)
var ITEMS=[
 {c:'환경친화성',q:'이 소재는 환경친화적이다.'},
 {c:'환경친화성',q:'이 소재의 생산 및 폐기는 환경에 비교적 적은 피해를 준다.'},
 {c:'환경친화성',q:'이 소재는 다른 소재보다 상대적으로 더 친환경적이다.'},
 {c:'환경친화성',q:'이 소재는 ‘환경친화적인 소재’라고 평가할 만하다.'},
 {c:'자연성',q:'이 소재는 자연적으로 느껴진다.'},
 {c:'자연성',q:'이 소재는 인위적으로 가공된 느낌이 적다.'},
 {c:'자연성',q:'이 소재는 인공적으로 느껴진다.',rev:true},
 {c:'사용선호',q:'내가 이 소재를 사용하는 것은 즐거울 것 같다.'},

 {c:'사용선호',q:'이 소재를 편안한 마음으로 사용할 수 있을 것 같다.'},
 {c:'사용선호',q:'이 소재는 나에게 좋은 느낌을 준다.'},
 {c:'사용선호',q:'이 소재를 사용하는 것은 나에게 즐거움을 줄 것 같다.'},
 {c:'품질지각',q:'이 소재는 일관된 품질을 가진 것 같다.'},
 {c:'품질지각',q:'이 소재는 잘 만들어진 것 같다.'},
 {c:'품질지각',q:'이 소재는 적절한 수준의 품질을 가진 것 같다.'},
 {c:'품질지각',q:'이 소재는 마감 품질이 좋지 않을 것 같다.',rev:true},
 {c:'품질지각',q:'이 소재는 오래 지속되지 않을 것 같다.',rev:true},
 {c:'품질지각',q:'이 소재는 지속적으로 좋은 성능을 보일 것 같다.'}
];
var N_ITEMS=ITEMS.length;
var TOTAL_TRIALS=9;

function pad2(n){return (n<10?'0':'')+n;}
var PIDS=[],i0;
for(i0=1;i0<=N_PER_GROUP;i0++)PIDS.push('V'+pad2(i0));
for(i0=1;i0<=N_PER_GROUP;i0++)PIDS.push('T'+pad2(i0));
var TOTAL=PIDS.length*TOTAL_TRIALS;
function condOf(pid){return pid.charAt(0);}

// ─── 제시 순서 ───
// 같은 번호의 V·T 참가자는 같은 순서를 받는다(집단 간 순서 통제).
// 세트 순서: 6가지 순열을 번호 순으로 순환. 세트 안 시편 순서: 3칸 회전(세트마다 오프셋) + 18명마다 방향 반전.
var ordCache={};
function ordOf(pid){
  if(ordCache[pid])return ordCache[pid];
  var k=parseInt(pid.slice(1),10)-1,perm=SET_ORDER_MODE==='fixed'?PERMS[0]:PERMS[k%6],out=[],t=1;
  for(var s=0;s<3;s++){
    var base=LEVELS[perm[s]].slice(),rot=(Math.floor(k/6)+s)%3;

    for(var p=0;p<3;p++)out.push({trial:t++,set:s+1,pos:p+1,level:perm[s],material:arr[p]});
  }
  ordCache[pid]=out;return out;
}

// ─── 저장소 ───
var LS_REC='st2_records_v1',LS_Q='st2_queue_v1',SS_RUN='st2_run_v1',LS_DEV='st2_dev_v1',LS_SET='st2_settings_v1',LS_PAY='st2_pay_v1',LS_AKEY='st2_akey_v1';
var records={},queue=[],serverAnswered={},serverOk=null,deviceId='',run=null,payInfo=[],adminKey='';

records=lsGet(LS_REC,{})||{};queue=lsGet(LS_Q,[])||[];payInfo=lsGet(LS_PAY,[])||[];settings=lsGet(LS_SET,settings)||settings;
try{adminKey=localStorage.getItem(LS_AKEY)||'';}catch(e){}
try{deviceId=localStorage.getItem(LS_DEV)||'';if(!deviceId){deviceId='dev-'+Math.random().toString(36).slice(2,8);localStorage.setItem(LS_DEV,deviceId);}}catch(e){deviceId='dev-x';}

}

function answeredSet(pid){
  var s={},k,a=records[pid]||{},b=serverAnswered[pid]||{};
  for(k in a)s[k]=true;for(k in b)s[k]=true;return s;
}
function countOf(pid){return Object.keys(answeredSet(pid)).length;}
function totalCount(){var n=0;for(var i=0;i<PIDS.length;i++)n+=countOf(PIDS[i]);return n;}
function nextTrial(pid,after){
  var s=answeredSet(pid);
  for(var t=(after||0)+1;t<=TOTAL_TRIALS;t++){if(!s[t])return t;}
  return 0;
}

// ─── 서버 통신 ───
function post(body){
  if(!body.key)body.key=APIKEY;
  return fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();});
}
var flushing=false;
function flush(){
  if(!ENDPOINT||!queue.length||flushing)return Promise.resolve(false);
  flushing=true;
  var batch=queue.slice();
  return post({records:batch}).then(function(res){
    flushing=false;
    if(res&&res.ok){queue=queue.filter(function(q){return batch.indexOf(q)<0;});saveQueue();return true;}
    return false;
  },function(){flushing=false;return false;});
}
function refresh(){
  if(!ENDPOINT)return Promise.resolve(false);
  return fetch(ENDPOINT,{redirect:'follow'}).then(function(r){return r.json();}).then(function(res){
    if(res&&res.ok){
      serverAnswered={};
      for(var pid in res.answered){serverAnswered[pid]={};res.answered[pid].forEach(function(t){serverAnswered[pid][t]=true;});}
      serverOk=true;return true;
    }
    serverOk=false;return false;
  },function(){serverOk=false;return false;});
}

// ─── 응답 기록 ───
function saveRecord(pid,trial,ratings,rateSec){
  var o=ordOf(pid)[trial-1],now=Date.now();
  var rec={pid:pid,cond:COND_KEY[condOf(pid)],trial:trial,set:o.set,level:o.level,pos:o.pos,material:o.material,
    ratings:ratings,rateSec:rateSec,ts:new Date(now).toISOString(),client:deviceId+(settings.test?'-test':'')};
  (records[pid]=records[pid]||{})[trial]={m:o.material,r:ratings,t:now};
  queue.push(rec);saveRecords();saveQueue();
}
function randRatings(){var r=[];for(var i=0;i<N_ITEMS;i++)r.push(1+Math.floor(Math.random()*LIKERT_MAX));return r;}

// ─── 화면 상태 ───
var route={v:'home'};
var timer=null,tok=0,codeTimer=null;
function clearTimer(){if(timer){clearInterval(timer);timer=null;}tok++;}
function countdown(ms,onTick,onEnd){
  clearTimer();var my=tok,end=run.phStart+ms;
  function tick(){
    if(my!==tok)return;
    var left=end-Date.now();
    if(left<=0){clearTimer();onTick(0);onEnd();return;}
    onTick(left);
  }
  tick();timer=setInterval(tick,200);
}
function go(r){route=r;render();window.scrollTo(0,0);}
function setPhase(ph,trial){
  run.ph=ph;if(trial)run.trial=trial;run.phStart=Date.now();run.draft=[];
  for(var i=0;i<N_ITEMS;i++)run.draft.push(null);
  saveRun();render();window.scrollTo(0,0);
}
function startPid(pid){
  var nt=nextTrial(pid,0);
  run={pid:pid,trial:nt||TOTAL_TRIALS,ph:'intro',phStart:Date.now(),draft:null};
  if(!nt)run.ph='done';
  else if(nt===1)run.ph='intro';
  else if(ordOf(pid)[nt-1].pos===1)run.ph='break';
  else run.ph='obs';
  run.draft=[];for(var i=0;i<N_ITEMS;i++)run.draft.push(null);
  saveRun();go({v:'run'});
}
function leaveRun(){clearTimer();run=null;saveRun();go({v:'home'});}

function render(){
  clearTimer();
  if(route.v==='admin')return renderAdmin();
  if(route.v==='info')return renderInfo();
  if(route.v==='run'&&run){
    if(run.ph==='intro')return renderIntro();
    if(run.ph==='obs')return renderObs();
    if(run.ph==='rate')return renderRate();
    if(run.ph==='break')return renderBreak();
    if(run.ph==='done')return renderDone();
  }
  route={v:'home'};renderHome();
}

function groupGrid(prefix){
  var doneN=0,partN=0,cells='';
  for(var i=0;i<PIDS.length;i++){
    var pid=PIDS[i];if(pid.charAt(0)!==prefix)continue;
    var c=countOf(pid),cls='pbtn',st='시작 전';
    if(c>=TOTAL_TRIALS){cls+=' done';st='완료';doneN++;}
    else if(c>0){cls+=' part';st=c+' / '+TOTAL_TRIALS;partN++;}
    cells+='<button class="'+cls+'" data-act="pick" data-pid="'+pid+'"><span class="pid mono">'+pid+'</span><span class="st">'+st+'</span></button>';

  return '<div class="sect"><p class="sectlab">'+COND_LABEL[prefix]+' 집단 ('+prefix+') — 완료 '+doneN+' · 진행 중 '+partN+'</p><div class="pgrid">'+cells+'</div></div>';

  var row=app.querySelector('[data-row="'+i+'"]');
  if(row){
    row.classList.remove('miss');
    var bs=row.querySelectorAll('.dot');
    for(var k=0;k<bs.length;k++)bs[k].setAttribute('aria-pressed',String(Number(bs[k].getAttribute('data-val'))===v));

function submitRate(){
  var miss=-1;
  for(var i=0;i<N_ITEMS;i++){
    var row=app.querySelector('[data-row="'+i+'"]');
    if(run.draft[i]==null){if(miss<0)miss=i;if(row)row.classList.add('miss');}
  }
  if(miss>=0){
    document.getElementById('missnote').classList.add('show');
    var r=app.querySelector('[data-row="'+miss+'"]');
    if(r&&r.scrollIntoView)r.scrollIntoView({block:'center',behavior:'smooth'});
    return;
  }
  var sec=Math.round((Date.now()-run.phStart)/100)/10;
  var pid=run.pid,trial=run.trial,cur=ordOf(pid)[trial-1];
  saveRecord(pid,trial,run.draft.slice(),sec);
  flush().then(function(){refresh().then(function(){if(route.v==='admin'||route.v==='home')render();});});
  var nt=nextTrial(pid,trial);
  if(!nt){setPhase('done');return;}
  if(ordOf(pid)[nt-1].set!==cur.set)setPhase('break',nt);
  else setPhase('obs',nt);
}

// ─── 인적사항 ───
function digits(s){return String(s==null?'':s).replace(/[^0-9]/g,'');}
// 항상 '문자열'로 다룬다. 앞자리 0이 사라지지 않도록 하이픈 형식으로 정규화.
function fmtRRN(s){var d=digits(s).slice(0,13);return d.length>6?d.slice(0,6)+'-'+d.slice(6):d;}
function fmtPhone(s){
  var d=digits(s);if(!d)return '';
  if(d.slice(0,2)==='02')return d.length>9?d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10):d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5,9);
  if(d.length>10)return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11);
  return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6,10);
}
function maskRRN(s){var d=digits(s);return d.length>=7?d.slice(0,6)+'-'+d.charAt(6)+'******':String(s||'');}

var serverPay=null,payFetchState=null;
function fetchPayList(){
  if(!ENDPOINT||!adminKey)return Promise.resolve(false);
  payFetchState='loading';
  return post({action:'listinfo',key:adminKey}).then(function(res){
    if(res&&res.ok){
      serverPay=res.list||[];payFetchState='ok';
      var ids={};serverPay.forEach(function(p){ids[p.id]=true;});
      var ch=false;payInfo.forEach(function(p){if(p.id&&ids[p.id]&&!p.synced){p.synced=true;ch=true;}});
      if(ch)savePay();
      if(route.v==='admin')render();return true;
    }
    payFetchState=(res&&res.error==='bad_admin_key')?'badkey':'err';if(route.v==='admin')render();return false;
  },function(){payFetchState='err';if(route.v==='admin')render();return false;});
}
function syncPay(){
  if(!ENDPOINT)return Promise.resolve(false);
  var chain=Promise.resolve();
  payInfo.filter(function(p){return !p.synced;}).forEach(function(p){
    chain=chain.then(function(){return post({action:'addinfo',info:p}).then(function(res){if(res&&res.ok){p.synced=true;savePay();}},function(){});});
  });
  return chain.then(function(){return adminKey?fetchPayList():true;});
}
function mergedPay(){
  if(serverPay===null)return payInfo.slice();
  var ids={};serverPay.forEach(function(p){ids[p.id]=true;});
  return serverPay.slice().concat(payInfo.filter(function(p){return !p.synced&&!ids[p.id];}));
}

function payCSV(mask){
  function esc(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"';}
  // 엑셀이 앞자리 0을 지우거나 지수 표기로 바꾸지 못하도록 텍스트로 강제 (주민번호·연락처·계좌·일자)
  function esct(s){return '="'+String(s==null?'':s).replace(/"/g,'""')+'"';}
  var list=mergedPay(),lines;
  if(mask){
    lines=['연번,성명,주민번호,소속,직위,활용일시,연락처,주소,청구금액,계좌정보'];
    list.forEach(function(p,i){
      var acct=[p.bank,p.holder,p.acct].filter(Boolean).join(', ');
      lines.push([i+1,esc(p.name),esct(maskRRN(p.rrn)),esc(p.org),esc(p.pos),esct(p.dt),esct(p.phone),esc(p.addr),esc(p.amt),esc(acct)].join(','));
    });
  }else{
    lines=['연번,성명,주민등록번호,소속,직위,활용일시,연락처,주소,청구금액,예금주,은행,계좌번호'];
    list.forEach(function(p,i){
      lines.push([i+1,esc(p.name),esct(p.rrn),esc(p.org),esc(p.pos),esct(p.dt),esct(p.phone),esc(p.addr),esc(p.amt),esc(p.holder),esc(p.bank),esct(p.acct)].join(','));
    });
  }
  return '﻿'+lines.join('\r\n');
}
function blobSave(name,data,type){
  var b=new Blob([data],{type:type||'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function buildCSV(){
  function esct(s){return '="'+s+'"';}
  var head=['participant','condition','trial','set','level','position','material'];
  for(var i=0;i<N_ITEMS;i++)head.push('q'+pad2(i+1)+(ITEMS[i].rev?'_rev':''));
  head=head.concat(['rate_sec','timestamp']);
  var lines=[head.join(',')];
  PIDS.forEach(function(pid){
    var rs=records[pid]||{};
    Object.keys(rs).map(Number).sort(function(a,b){return a-b;}).forEach(function(t){
      var o=ordOf(pid)[t-1],rec=rs[t];
      lines.push([pid,COND_KEY[condOf(pid)],t,o.set,o.level,o.pos,o.material].concat(rec.r).concat(['',new Date(rec.t).toISOString()]).join(','));
    });
  });
  return '﻿'+lines.join('\r\n');
}

function arm(key){armed=key;setTimeout(function(){if(armed===key){armed=null;if(route.v==='admin')render();}},4000);render();}
app.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null;if(!b)return;
  var act=b.getAttribute('data-act');
  if(act==='pick'){startPid(b.getAttribute('data-pid'));}
  else if(act==='goinfo'){infoSaved=false;pendingInfoPid=null;go({v:'info'});}
  else if(act==='goinfo-run'){infoSaved=false;pendingInfoPid=run?run.pid:null;go({v:'info'});}
  else if(act==='leave'){leaveRun();}
  else if(act==='showcode'){showCode(b,Number(b.getAttribute('data-trial')));}
  else if(act==='begin'){setPhase('obs');}
  else if(act==='startrate'){setPhase('rate');}
  else if(act==='skip'){if(run.ph==='obs')setPhase('rate');else setPhase('obs');}
  else if(act==='dot'){setDot(Number(b.getAttribute('data-item')),Number(b.getAttribute('data-val')));}
  else if(act==='submit'){submitRate();}
  else if(act==='rand'){fillRandom();}
  else if(act==='stepauto'){fillRandom();submitRate();}
  else if(act==='info-save'){saveInfo();}
  else if(act==='info-new'){infoSaved=false;pendingInfoPid=null;render();window.scrollTo(0,0);}
  else if(act==='info-back'){infoSaved=false;history.replaceState(null,'',location.pathname);route={v:'run'};render();}
  else if(act==='home'){history.replaceState(null,'',location.pathname);go({v:'home'});refresh().then(render);}
  else if(act==='refresh'){refresh().then(render);}
  else if(act==='retry'){flush().then(function(){return refresh();}).then(render);}
  else if(act==='csv'){blobSave('study2_responses_local.csv',buildCSV());}
  else if(act==='tbl-toggle'){adminTableOpen=!adminTableOpen;render();}
  else if(act==='showorder'){orderShown=document.getElementById('orderpid').value;render();}
  else if(act==='del'){
    var pid=b.getAttribute('data-pid');
    if(armed!=='p'+pid){arm('p'+pid);return;}
    armed=null;delete records[pid];saveRecords();
    queue=queue.filter(function(q){return q.pid!==pid;});saveQueue();
    delete serverAnswered[pid];
    if(ENDPOINT)post({action:'reset',pid:pid}).then(function(){return refresh();}).then(render,function(){serverOk=false;render();});
    render();
  }
  else if(act==='deltrial'){
    var dp=b.getAttribute('data-pid'),dt=Number(b.getAttribute('data-trial'));
    if(armed!=='t'+dp+dt){arm('t'+dp+dt);return;}
    armed=null;
    if(records[dp])delete records[dp][dt];saveRecords();
    queue=queue.filter(function(q){return !(q.pid===dp&&q.trial===dt);});saveQueue();
    if(serverAnswered[dp])delete serverAnswered[dp][dt];
    if(ENDPOINT)post({action:'deltrial',pid:dp,trial:dt}).then(function(){return refresh();}).then(render,function(){serverOk=false;render();});
    render();
  }
  else if(act==='tg-test'){settings.test=!settings.test;saveSettings();render();}
  else if(act==='tg-text'){settings.bigText=!settings.bigText;saveSettings();applySettings();render();}
  else if(act==='tg-dots'){settings.bigDots=!settings.bigDots;saveSettings();applySettings();render();}
  else if(act==='akey-save'){var k=(document.getElementById('akey_in').value||'').trim();if(k){adminKey=k;try{localStorage.setItem(LS_AKEY,k);}catch(er){}fetchPayList();render();}}
  else if(act==='akey-reset'){adminKey='';try{localStorage.removeItem(LS_AKEY);}catch(er){}payFetchState=null;serverPay=null;render();}
  else if(act==='pay-refresh'){fetchPayList();render();}
  else if(act==='pay-csv-full'){blobSave('participants_수기입력용.csv',payCSV(false));}
  else if(act==='pay-csv-mask'){blobSave('participants_증빙용.csv',payCSV(true));}
  else if(act==='pay-json'){blobSave('participants_backup.json',JSON.stringify(mergedPay(),null,1),'application/json');}
  else if(act==='pay-del'){
    var id=b.getAttribute('data-id');
    if(armed!=='pd'+id){arm('pd'+id);return;}
    armed=null;payInfo=payInfo.filter(function(p){return p.id!==id;});savePay();
    if(serverPay)serverPay=serverPay.filter(function(p){return p.id!==id;});
    if(ENDPOINT&&adminKey)post({action:'delinfo',key:adminKey,id:id}).then(function(){return fetchPayList();});
    render();
  }
  else if(act==='pay-clear'){
    if(armed!=='payclear'){arm('payclear');return;}
    armed=null;payInfo=[];savePay();serverPay=serverPay?[]:serverPay;
    if(ENDPOINT&&adminKey)post({action:'clearinfo',key:adminKey}).then(function(){return fetchPayList();});
    render();
  }
});
app.addEventListener('input',function(e){
  var t=e.target;if(!t||!t.id)return;
  // 입력 즉시 문자열 형식으로 정리(숫자로 취급하지 않음)
  if(t.id==='pi_rrn')t.value=fmtRRN(t.value);
  else if(t.id==='pi_phone')t.value=fmtPhone(t.value);
  else if(t.id==='pi_acct')t.value=t.value.replace(/[^0-9\-]/g,'');
  else if(t.id==='pi_amt')t.value=digits(t.value);
});
document.addEventListener('keydown',function(e){
  if(!settings.test||route.v!=='run'||!run||run.ph!=='rate')return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'))return;
  if(e.key==='r'||e.key==='R'){fillRandom();}
  else if(e.key===' '){e.preventDefault();fillRandom();submitRate();}
});
window.addEventListener('hashchange',function(){
  if(location.hash==='#admin'){go({v:'admin'});refresh().then(render);syncPay();}
  else if(location.hash==='#info'){infoSaved=false;go({v:'info'});}
  else if(route.v==='admin'||route.v==='info'){route=(run?{v:'run'}:{v:'home'});render();}
});
window.addEventListener('online',function(){flush();syncPay();});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
}

applySettings();
if(location.hash==='#admin')route={v:'admin'};
else if(location.hash==='#info')route={v:'info'};
else if(run&&run.pid&&PIDS.indexOf(run.pid)>=0)route={v:'run'};
else{run=null;saveRun();route={v:'home'};}
render();
refresh().then(function(){if(route.v!=='run')render();if(queue.length)flush();});
if(route.v==='admin')syncPay();
})();

</script>
</body>
</html>
